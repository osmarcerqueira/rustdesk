name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Build Flutter APK
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release
        env:
          ANDROID_NDK_HOME: ${{ steps.install-ndk.outputs.ndk-path }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulInformatica-Android-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk