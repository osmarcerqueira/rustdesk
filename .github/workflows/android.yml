name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android NDK & cargo-ndk
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.2"
          cargo install cargo-ndk

      - name: Install vcpkg dependencies for Android
        run: |
          git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh
          $GITHUB_WORKSPACE/vcpkg/vcpkg install --classic libvpx libyuv opus libaom --triplet arm64-android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Build Android NDK libs
        run: |
          cargo ndk -t arm64-v8a -o flutter/android/app/src/main/jniLibs/ build --release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Build Flutter APK
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulInformatica-Android-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk