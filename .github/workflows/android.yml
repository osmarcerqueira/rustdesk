name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android NDK & cargo tools
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.2"
          cargo install cargo-ndk
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked

      - name: Install vcpkg dependencies for Android
        run: |
          git clone https://github.com/microsoft/vcpkg.git $GITHUB_WORKSPACE/vcpkg
          $GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh
          $GITHUB_WORKSPACE/vcpkg/vcpkg install --classic libvpx libyuv opus aom --triplet arm64-android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Build ndk_compat library
        run: |
          mkdir -p $GITHUB_WORKSPACE/ndk_compat_build
          cd $GITHUB_WORKSPACE/ndk_compat_build
          echo 'void ndk_compat_dummy() {}' > dummy.c
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang -c dummy.c -o dummy.o
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs libndk_compat.a dummy.o
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653

      - name: Install Flutter dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Generate Flutter Rust Bridge code
        run: |
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart --skip-deps-check

      - name: Build Android NDK libs
        run: |
          cargo ndk -t arm64-v8a -o flutter/android/app/src/main/jniLibs/ build --release --features flutter
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          RUSTFLAGS: "-L ${{ github.workspace }}/ndk_compat_build"

      - name: Build Flutter APK
        run: |
          cd flutter
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
        env:
          GRADLE_OPTS: "-Xmx6g -XX:+UseG1GC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulInformatica-Android-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk